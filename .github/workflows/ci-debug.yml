# ============================================================
#  LAB 2 — Debug : ce workflow contient 3 erreurs volontaires
#
#  🎯 Mission : trouve et corrige les 3 erreurs pour que
#               le pipeline devienne vert.
#
#  💡 Indice : une erreur YAML, une erreur de commande,
#              une erreur de chemin.
# ============================================================

name: ci-debug

on:
  push:
  pull_request:

jobs:
  test:
  runs-on: ubuntu-latest        # ← ERREUR 1 : indentation incorrecte

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: pytestt tests/ -v    # ← ERREUR 2 : faute de frappe dans la commande

      - name: Rapport de couverture
        run: pytest test/ --cov=app --cov-report=term-missing   # ← ERREUR 3 : mauvais chemin
