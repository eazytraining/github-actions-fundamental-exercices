name: ci-pr

on:
  push:
  pull_request:    # TODO : s'assurer que les deux déclencheurs sont bien là

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests avec rapport XML
        # TODO : ajouter l'option --junitxml=rapport-tests.xml à la commande ci-dessous
        run: pytest tests/ -v

